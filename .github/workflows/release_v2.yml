name: Manual Windows Build V0.3
on:
  workflow_dispatch:

env:
  CARGO_INCREMENTAL: 0 
  FORCE_JAVASCRIPT_ACTIONS_TO_NODE24: true 

jobs:
  build:
    runs-on: windows-latest
    permissions:
      contents: write
    steps:
      - name: Checkout repository
        uses: actions/checkout@v5 

      - name: Install pnpm
        uses: pnpm/action-setup@v6 
        with:
          version: 10 

      - name: Setup Node
        uses: actions/setup-node@v6 
        with:
          node-version: lts/*
          cache: 'pnpm'

      - name: Install Rust toolchain
        uses: dtolnay/rust-toolchain@stable

      - name: Rust Cache
        id: rust-cache
        uses: swatinem/rust-cache@v2
        with:
          workspaces: "src-tauri -> target"
          cache-all-crates: "true"
          cache-targets: "true"
          key: "release"

      - name: Install dependencies
        run: pnpm install --frozen-lockfile

      - name: Build Tauri App
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        shell: bash
        run: |
          stdbuf -oL -eL pnpm tauri build --bundles nsis --config src-tauri/tauri.windows.conf.json -- --message-format=json 2>&1 | tee cargo_build.log

      - name: Generate Build & Cache Summary
        if: always()
        shell: bash
        run: |
          cache_hit="${{ steps.rust-cache.outputs.cache-hit }}"
          if [ "$cache_hit" = "true" ]; then
            status="✅ Hit"
          else
            status="❌ Miss"
          fi

          if [ -f cargo_build.log ]; then
            cached_crates=$(grep -c '"fresh":true' cargo_build.log || echo 0)
            compiled_crates=$(grep -c '"fresh":false' cargo_build.log || echo 0)
            total_crates=$((cached_crates + compiled_crates))

            if [ "$total_crates" -gt 0 ]; then
              reuse_percent=$(awk "BEGIN {printf \"%.1f\", ($cached_crates / $total_crates) * 100}")
            else
              reuse_percent="0.0"
            fi
          else
            cached_crates="0"
            compiled_crates="0"
            total_crates="0"
            reuse_percent="0.0"
          fi

          cat << EOF >> "$GITHUB_STEP_SUMMARY"
          ### 📊 Rust 缓存颗粒度与复用率（硬数据）

          | 指标 | 确切数值 | 说明 |
          | :--- | :--- | :--- |
          | **Rust Cache 状态** | $status | 来自 swatinem/rust-cache |
          | **跳过编译 (复用缓存)** | **$cached_crates** 个 Crate | 物理未改变，直接命中缓存 |
          | **重新编译** | **$compiled_crates** 个 Crate | 真正触发 Rust 编译的模块 |
          | **项目 Crate 总数** | **$total_crates** 个 Crate | 包含全部依赖库与主项目代码 |
          | **缓存复用率** | **${reuse_percent}%** | 复用 Crate 占总数的百分比 |
          EOF

      - name: Upload Portable EXE
        uses: actions/upload-artifact@v4
        with:
          name: Portable-Binary
          path: src-tauri/target/release/*.exe

      - name: Upload bundle
        uses: actions/upload-artifact@v4
        with:
          name: bundle
          path: src-tauri/target/release/bundle/**/*.exe

      - name: Upload deps
        uses: actions/upload-artifact@v4
        with:
          name: deps
          path: src-tauri/target/release/deps/**/*.exe

      - name: Upload All Executables
        uses: actions/upload-artifact@v4
        with:
          name: all-build-outputs
          path: src-tauri/target/release/**/*.exe