<!-- Inside this chunk, we design a pure 1920x1080 reference system -->
<div style="width: 100%; height: 100%; box-sizing: border-box; border: 2px dashed rgba(220, 20, 60, 0.8); background: rgba(220, 20, 60, 0.05); position: relative;">
    
    <!-- Vertical Center Guideline -->
    <div style="position: absolute; left: 50%; top: 0; width: 1px; height: 100%; border-left: 1px dotted rgba(255,255,255,0.3); transform: translateX(-50%);"></div>
    
    <!-- Horizontal Center Guideline -->
    <div style="position: absolute; top: 50%; left: 0; height: 1px; width: 100%; border-top: 1px dotted rgba(255,255,255,0.3); transform: translateY(-50%);"></div>

    <!-- Indicator badge -->
    <div style="position: absolute; top: 10px; left: 10px; color: rgba(255,255,255,0.5); font-family: monospace; font-size: 12px; background: rgba(0,0,0,0.5); padding: 2px 6px;">
        REF_BOX: 1920x1080 (Physical boundary check)
    </div>
</div>
